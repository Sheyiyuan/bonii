[package]
name = "bonii"
version = "0.1.0"
edition = "2024"
description = "ボニー (bonii): check whether a project or package name is already taken across GitHub, language registries and distro repositories."
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }
toml = "0.8"
