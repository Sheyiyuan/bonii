[package]
name = "bonii"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "ボニー (bonii): check whether a project or package name is already taken across GitHub, language registries and distro repositories."
license = "MIT"
authors = ["Sheyiyuan"]
repository = "https://github.com/Sheyiyuan/bonii"
homepage = "https://github.com/Sheyiyuan/bonii"
readme = "README.md"
keywords = ["cli", "name-checker", "availability", "package", "registry"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "target/"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }
toml = "0.8"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
