name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（形如 v0.1.0）"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG 与 Cargo.toml 版本 $version 不一致"
            exit 1
          fi

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: sh -n scripts/install.sh
      - run: cargo package --locked

  build:
    name: Build ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            os_name: linux
            arch: amd64
            cross: false
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            os_name: linux
            arch: arm64
            cross: true
          - name: macos-amd64
            os: macos-14
            target: x86_64-apple-darwin
            os_name: darwin
            arch: amd64
            cross: false
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            os_name: darwin
            arch: arm64
            cross: false
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch: amd64
            cross: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name="bonii_${version}_${{ matrix.os_name }}_${{ matrix.arch }}"
          bin="bonii"
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            bin="bonii.exe"
          fi
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/$bin" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          if [ "${{ matrix.os_name }}" = "windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/$name/*' -DestinationPath 'dist/$name.zip' -Force"
          else
            tar -czf "dist/$name.tar.gz" -C dist "$name"
          fi
          rm -rf "dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        shell: bash
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: bonii ${{ env.TAG }}
          generate_release_notes: true
          append_body: |
            ## 安装

            ```bash
            cargo install bonii --locked
            ```

            或者用预编译二进制（Linux / macOS）：

            ```bash
            curl -fsSLO https://github.com/Sheyiyuan/bonii/releases/latest/download/install.sh
            sh install.sh
            ```
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            scripts/install.sh
          fail_on_unmatched_files: true

  crates-io:
    name: Publish crates.io
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if curl -fsS -A "bonii-release" "https://crates.io/api/v1/crates/bonii/${version}" >/dev/null; then
            echo "bonii ${version} 已在 crates.io 上，跳过发布"
            exit 0
          fi
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::缺少 CARGO_REGISTRY_TOKEN secret，无法发布到 crates.io"
            exit 1
          fi
          cargo publish --locked --registry crates-io
